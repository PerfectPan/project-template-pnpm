packages:
  - packages/*
  - scripts

# Versions shared by workspace packages are declared once here and referenced with "catalog:".
# catalogMode: strict fails the install when a workspace package depends on an external package the
# catalog does not declare, which keeps dependency versions identical across packages.
catalogMode: strict
catalog:
  # The bundled vitest peers on a real `vite` range, while vite-plus provides `vite` as this core alias;
  # pnpm can only satisfy that peer through the override below. Keep the version in lockstep with the
  # `vite-plus` entry (same release train; Dependabot does not see the mapping).
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  '@perfectpan/lint-config': github:PerfectPan/lint-config#v0.6.0
  '@types/node': 24.19.1
  typescript: 7.0.2
  vite-plus: 1.1.0

# Redirect whatever declares a `vite` range to the vite-plus core alias.
overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite

# Reject versions published less than a day ago, in minutes.
minimumReleaseAge: 1440

strictPeerDependencies: true
autoInstallPeers: true

allowBuilds:
  # Its postinstall verifies the platform binary that the bundled vite runs.
  esbuild: true

versioning:
  # `pnpm version -r` must delete consumed changesets and write each package's CHANGELOG.md immediately.
  # The default ("registry") keeps changesets until the registry confirms publication, which would keep the
  # Version Packages pull request open forever because the changesets action decides from the remaining files.
  changelog:
    storage: repository
  # Every published package currently versions and releases on its own. To release a set in lockstep at one
  # shared version, add a fixed group; its members then always bump and publish together, and one release tag
  # covers all of them:
  # fixed:
  #   - ['@scope/example', '@scope/other']
